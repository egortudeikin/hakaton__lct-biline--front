<!doctype html>
<html lang="ru" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Билайн</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="page__body">
    <main class="main">
      <section class="section profile__section">
        <div class="profile__container">
          <header class="profile__header">
            <div class="profile__header-container">
              <div class="profile__header-info">
                <a href="#" class="profile__header-link">
                  <svg width="36" height="40">
                    <use href="./decor/icon-profile.svg"></use>
                  </svg>
                </a>
                <div class="profile__header-info-description">
                  <p class="profile__name">Иван Петров</p>
                  <p class="profile__post">Инженер WFM • ID: #ENG-104</p>
                </div>
              </div>
              <div class="profile__status">
                <svg width="13" height="13">
                  <use href="./decor/online-icon.svg"></use>
                </svg>
                <p class="profile__status-text">НА СМЕНЕ</p>
              </div>
            </div>
          </header>
          <main class="profile__main">
            <div class="profile__container">
              <div class="profile__info">
                <p class="profile__plan">План на день: <span class="profile__plan--accent">3 заявки</span></p>
                <p class="profile__route">Маршрут: <span class="profile__route--accent">14.2 км (~45 мин)</span></p>
                <p class="profile__trunk">Багажник OK</p>
              </div>
            </div>
          </main>
        </div>
      </section>
    </main>
  </body>
</html>
