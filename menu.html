<!doctype html>
<html lang="ru" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Билайн</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="page__body">
    <main class="main">
      <section class="section menu__section">
        <div class="menu__container">
          <header class="menu__header">
            <div class="header__container">
              <a href="#" class="header__link-logo">
                <svg width="44" height="44">
                  <use href="./decor/beeline-seeklogo.svg"></use>
                </svg>
              </a>
              <div class="header__mini-container">
                <div class="header__buttons">
                  <button class="header__button--light">Light</button>
                  <button class="header__button--no-active">Dark</button>
                </div>
                <a href="#" class="header__link-profile">
                  <svg width="36" height="40">
                    <use href="./decor/icon-profile.svg"></use>
                  </svg>
                </a>
              </div>
            </div>
          </header>
          <main class="menu__main">
            <div class="menu__container">
              <div class="menu__buttons">
                <button class="menu__button-opt">Оптимизировать</button>
                <button class="menu__button-plan">Базовый план</button>
                <button class="menu__button-request">+ Срочная заявка</button>
              </div>
              <div class="menu__masters-info">
                <div class="menu__masters-online">
                  <p class="menu__masters-online-title">Мастера в сети</p>
                  <p class="menu__master-online-description">2 / 2 чел.</p>
                </div>
                <div class="menu__masters-mileage">
                  <p class="menu__masters-mileage-title">Пробег сети</p>
                  <div class="menu__masters-mileage-descriptions">
                    <p class="menu__master-mileage-description">32.4 км</p>
                    <p class="menu__master-mileage-description-percent">-15%</p>
                  </div>
                </div>
              </div>
              <div class="menu__masters">
                <div class="menu__masters--info">
                  <h2 class="menu__masters-title">МАСТЕРА (2)</h2>
                  <button class="menu__masters-button">+ Добавить</button>
                </div>
                <div class="menu__masters-cards">
                    <article class="menu__masters-card">
                        <h3 class="menu__masters-card-title">Иван Петров (Авто)</h3>
                        <p class="menu__masters-card-description">Смена: 08:00–17:00 | Заявок: 3</p>
                    </article>
                    <article class="menu__masters-card--disabled">
                        <h3 class="menu__masters-card-title menu__masters-card-title--disabled">Алексей Смирнов (Пеший)</h3>
                        <p class="menu__masters-card-description menu__masters-card-description--disabled">Смена: 09:00–18:00 | Заявок: 2</p>
                    </article>
                </div>
              </div>
              <div class="menu__applications">
                <h2 class="menu__applications-title">ЗАЯВКИ (6)</h2>
                <div class="menu__applications-buttons">
                    <button class="menu__unallocated-applications-button">Нераспределённые</button>
                </div>
              </div>
            </div>
          </main>
        </div>
      </section>
    </main>
  </body>
</html>
